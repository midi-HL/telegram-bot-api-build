name: Build telegram-bot-api

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'tdlib/telegram-bot-api git ref (tag/branch/sha)'
        required: false
        default: 'master'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350

    steps:
      - name: Show environment
        run: |
          uname -m
          nproc
          df -h / | tail -1
          free -m | head -2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gperf libssl-dev zlib1g-dev git ca-certificates

      - name: Show toolchain
        run: |
          cmake --version | head -1
          g++ --version | head -1
          gperf --version | head -1

      - name: Clone telegram-bot-api with submodules
        run: |
          git clone --recursive --depth 1 \
            --branch "${{ github.event.inputs.ref || 'master' }}" \
            https://github.com/tdlib/telegram-bot-api.git src

      - name: Configure
        run: |
          cd src
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/home/runner/install \
                .. 2>&1 | tail -30

      - name: Build
        run: |
          cd src/build
          cmake --build . --target install -j"$(nproc)"

      - name: Verify binary
        run: |
          ls -lh /home/runner/install/bin/
          readelf -h /home/runner/install/bin/telegram-bot-api | grep -E 'Machine|Class'
          /home/runner/install/bin/telegram-bot-api --version || true

      - name: Package
        run: |
          cd /home/runner/install
          TARBALL="telegram-bot-api-${{ matrix.arch }}-linux.tar.gz"
          tar czf "$TARBALL" bin
          sha256sum "$TARBALL" | tee "SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-${{ matrix.arch }}
          path: |
            /home/runner/install/telegram-bot-api-${{ matrix.arch }}-linux.tar.gz
            /home/runner/install/SHA256SUMS-${{ matrix.arch }}.txt
          retention-days: 30
